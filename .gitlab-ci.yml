stages:
  - test

test_job:
  stage: test
  image: python:3.11
  before_script:
    - apt-get update
    - apt-get install -y libnspr4 libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libxkbcommon0 libasound2
  script:
    - pip install -r requirements.txt
    - python -m playwright install
    - pytest tests/ --maxfail=1 --disable-warnings -q
